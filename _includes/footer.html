{% assign ig = "https://www.instagram.com/" | append: site.data.instagram.handle | append: "/" %}
<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-about">
      <span class="footer-name">Travel Train</span>
      <p>{{ site.description }}</p>
      <p class="small">© {{ site.time | date: "%Y" }} Travel Train · by Aditya Kanoi</p>
    </div>
    <div class="footer-cols">
      <nav aria-label="Journeys">
        <span class="footer-head">Journeys</span>
        <a href="{{ '/#journeys' | relative_url }}">Latest</a>
        <a href="{{ '/#states' | relative_url }}">By state</a>
      </nav>
      <nav aria-label="Connect">
        <span class="footer-head">Connect</span>
        <a href="{{ ig }}" target="_blank" rel="noopener">Instagram</a>
        <a href="{{ site.data.instagram.reddit }}" target="_blank" rel="noopener">Reddit</a>
        <a href="{{ site.data.instagram.pinterest }}" target="_blank" rel="noopener">Pinterest</a>
      </nav>
    </div>
  </div>
</footer>
