<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Travel Train by Aditya Kanoi</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}Travel Train">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  {% if page.cover and page.cover != "" %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  {% include header.html %}
  <main id="content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
